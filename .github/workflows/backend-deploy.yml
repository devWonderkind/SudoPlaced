name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.SERVER_HOST }}
      USER: ${{ secrets.SERVER_USER }}

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts

      - name: "Step 1: Update Source Code"
        run: |
          ssh $USER@$HOST << 'EOF'
            set -e
            cd /var/www/sudoplaced
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
          EOF

      - name: "Step 2: Sync Dependencies (UV)"
        run: |
          ssh $USER@$HOST << 'EOF'
            set -e
            cd /var/www/sudoplaced/backend
            export PATH="$HOME/.local/bin:$PATH"
            # Remove old .venv if it was owned by another user (only needed once)
            # rm -rf .venv 
            uv sync --frozen
          EOF

      - name: "Step 3: Database Migrations & Static Files"
        run: |
          ssh $USER@$HOST << 'EOF'
            set -e
            cd /var/www/sudoplaced/backend
            export PATH="$HOME/.local/bin:$PATH"
            uv run manage.py migrate
            uv run manage.py collectstatic --noinput
          EOF

      - name: "Step 4: Restart Services"
        run: |
          ssh $USER@$HOST << 'EOF'
            set -e
            sudo systemctl restart gunicorn
            sudo systemctl restart nginx
          EOF