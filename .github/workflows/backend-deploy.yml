name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.SERVER_HOST }}
      USER: ${{ secrets.SERVER_USER }}

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts

      - name: Execute Remote Deployment
        run: |
          # Use -q to suppress login banners and BatchMode for non-interactive execution
          ssh -q -o BatchMode=yes $USER@$HOST << 'EOF'
            set -e
            
            echo "[1/4] Updating source code..."
            cd /var/www/sudoplaced
            git fetch -q origin main
            git reset --hard origin/main
            git clean -fd

            echo "[2/4] Synchronizing dependencies..."
            cd backend
            export PATH="$HOME/.local/bin:$PATH"
            uv sync --frozen --quiet

            echo "[3/4] Running database migrations and collecting static files..."
            uv run manage.py migrate --noinput
            uv run manage.py collectstatic --noinput > /dev/null

            echo "[4/4] Restarting application services..."
            sudo systemctl restart gunicorn
            sudo systemctl restart nginx
            
            echo "Deployment completed successfully."
          EOF